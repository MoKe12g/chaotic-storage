[package]
name = "chaotic-storage"
version = "0.1.0"
edition = "2024"

[dependencies]
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "macros", "fs"] }
log = "0.4.29"
anyhow = "1.0.102"
rocket = { version = "0.5.1", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
chrono = { version = "0.4.44", features = ["serde"] }
# using the git repo fixes a problem with the sqlx-conditional-queries macro for sqlx versions in development for 0.9.0 and after
#sqlx-conditional-queries = { version = "0.3.2", features = ["sqlite"] }
sqlx-conditional-queries = { git = "https://github.com/nitn3lav/sqlx-conditional-queries.git", rev = "a6d78d9", features = ["sqlite"] }
